<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Student Profile Page</title>
    </head>
    <body>
        <h1>Student Details :-</h1>
        <form>
        <label for="name">Student Name:</label>
        <input id="name" type="text" placeholder="Enter your name">
        <br>
        <label for="Eduction">Eduction:</label>
   
        <ol>
            <li>10th</li>
            <li>Intermediate</li>
            <li>Current Education</li>
        </ol>
        
        <input id="btech" type="radio" name="education">
        <label for="btech">B.Tech</label>

        <input id="degree" type="radio" name="education">
        <label for="degree">Degree</label>
        <br><br>
        <!-- Skills Section -->
        <label for="skills">Skills:</label>
        <br>
        <input id="skills-html" type="checkbox" name="skills" value="html">
        <label for="skill-html">HTML</label>
        <br>
        <input id="skill-css" type="checkbox" name="skills" value="css">        
        <label for="skill-css">CSS</label>        
        <br>
        <input id="skill-python" type="checkbox" name="skills" value="python">
        <label for="skill-python">Python</label>
        <br>
        <input id="skill-js" type="checkbox" name="skills" value="js">
        <label for="skill-js">JS</label>
        <br>
        <input id="skill-java" type="checkbox" name="skills" value="java">
        <label for="skill-java">Java</label>
        <br><br>
        <label for="other-skils">Other skils:</label>
        <br>
        <textarea id="other-skils" name="other_skils" rows="5" cols="25" placeholder="Other skils..."></textarea>
        <br><br>
        <!-- Hobbies Section -->
        <label for="hobbies">Hobbies:</label>
        <br>
        <input id="hobbies-editing" type="checkbox" name="hobbies" value="Editing">
        <label for="hobbies-editing">Editing </label>
        <input id="hobbies-coding" type="checkbox" name="hobbies" value="coding">
        <label for="hobbies-coding">Coding </label>
        <input id="hobbies-music" type="checkbox" name="hobbies" value="music">
        <label for="hobbies-music">Music listening </label> 
        <br><br>
        <label for="other-hobbies">Other Hobbies:</label><br>
        <textarea id="hobbies" rows="5" cols="30" placeholder="other's hobbies"></textarea>
        <br>
        <br>
        <!-- Profile Image-->
        <label for="profile-pic">Upload Profile Image:</label><br>
        <input id="profile-pic" name="profile_pic" type="file" accept="image/*">
        <br>
        <br>
        <!-- Phone Number -->
        <label for="phone">Phone NO.:</label>
        <input id="phone" type="tel" placeholder="+91-1234567890">
        <br>
        <br>
        <!-- Email -->
        <label for="email">Email:</label>
        <input id="email" type="email" placeholder="Enter your email">
        <br>
        <br>
        <!-- Message -->
        <label for="msg">Message:</label>
        <br>
        <textarea id="msg" name="message" rows="5" cols="30" placeholder="Give a message"></textarea>
        <br>
        <br>
        <!-- Action Buttons -->
        <button type="Submit">Submit</button>
        <button type="reset">Reset</button>
        </form>
         <hr>
        <footer>
            <p>
                &copy; 2026 Student Profile Page
            </p>
        </footer>
    </body>
</html>
